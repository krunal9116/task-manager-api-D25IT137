name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Backend Dependencies
        run: npm install
        working-directory: ./p12/backend

      - name: Run ESLint Inspection
        run: npm run lint
        working-directory: ./p12/backend

  build-and-test:
    name: Build & Automated Testing
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Backend Dependencies
        run: npm install
        working-directory: ./p12/backend

      - name: Run Automated Test Suite (Jest & Supertest)
        run: npm test
        working-directory: ./p12/backend
